name: Controllo nuovi prodotti

on:
  workflow_dispatch:
  schedule:
    # Gli orari pianificati di GitHub Actions sono espressi in UTC.
    - cron: "*/10 * * * *"

permissions:
  contents: read

concurrency:
  group: product-monitor
  cancel-in-progress: false

jobs:
  check-products:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa le dipendenze
        run: python -m pip install -r requirements.txt

      - name: Recupera la memoria dei prodotti
        uses: actions/cache@v4
        with:
          path: prodotti_visti.db
          key: product-state-${{ github.run_id }}
          restore-keys: |
            product-state-

      - name: Controlla i negozi
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BROWSER_FALLBACK: "true"
        run: python bot.py --once
